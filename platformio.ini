; 4WD SKATE — прошивка без веб-интерфейса (ESP32-WROOM-32 + 4× ODrive Pro по CAN)
; Сборка:  pio run           Прошивка:  pio run -t upload      Монитор:  pio device monitor

[env:denky32]
; Arduino core 2.0.x (ledcSetup/ledcAttachPin). Ветка 7.x / core 3.x сломает LEDC API — не обновлять без правок кода.
platform = espressif32 @ ^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
